<!DOCTYPE html>
<html lang="en-AU">
<head>
  <!-- Google Analytics — loads only after cookie consent -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    function swp_loadGA() {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-NR1ZB5W4N5';
      document.head.appendChild(s);
      s.onload = function() { gtag('js', new Date()); gtag('config', 'G-NR1ZB5W4N5'); };
    }
    if (localStorage.getItem('swp_cookie_consent') === 'accepted') { swp_loadGA(); }
  </script>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=contact.html" />
  <link rel="canonical" href="https://www.shiftwithpurpose.com.au/contact.html" />
  <title>Redirecting… | SHiFT with Purpose</title>
  <script>window.location.replace("contact.html");</script>
</head>
<body>
  <p>Redirecting to the contact page… <a href="contact.html">Click here if you are not redirected.</a></p>

  <!-- ============================================================
       COOKIE CONSENT BANNER
       ============================================================ -->
  <div id="swp-cookie-banner" style="display:none; position:fixed; bottom:0; left:0; right:0; z-index:9999; background:var(--color-primary-dark); padding:20px 32px; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; box-shadow:0 -2px 24px rgba(0,0,0,0.25);">
    <p style="color:rgba(255,255,255,0.85); font-size:0.9rem; line-height:1.65; margin:0; max-width:660px;">
      We use cookies to understand how people find and use this site (Google Analytics). No advertising trackers. No data sold. <a href="privacy.html" style="color:var(--color-sage); text-decoration:underline; text-underline-offset:3px;">Privacy policy</a>
    </p>
    <div style="display:flex; gap:12px; flex-shrink:0;">
      <button id="swp-cookie-decline" style="background:transparent; border:1px solid rgba(255,255,255,0.25); color:rgba(255,255,255,0.65); padding:10px 22px; border-radius:6px; cursor:pointer; font-size:0.88rem; font-family:inherit;">Decline</button>
      <button id="swp-cookie-accept" style="background:var(--color-sage); border:none; color:var(--color-navy); padding:10px 22px; border-radius:6px; cursor:pointer; font-size:0.88rem; font-weight:700; font-family:inherit;">Accept</button>
    </div>
  </div>
  <script>
    (function() {
      var KEY = 'swp_cookie_consent';
      var banner = document.getElementById('swp-cookie-banner');
      if (!localStorage.getItem(KEY) && banner) banner.style.display = 'flex';
      var a = document.getElementById('swp-cookie-accept');
      var d = document.getElementById('swp-cookie-decline');
      var p = document.getElementById('swp-cookie-prefs');
      if (a) a.addEventListener('click', function() {
        localStorage.setItem(KEY, 'accepted');
        if (banner) banner.style.display = 'none';
        if (typeof swp_loadGA === 'function') swp_loadGA();
      });
      if (d) d.addEventListener('click', function() {
        localStorage.setItem(KEY, 'declined');
        if (banner) banner.style.display = 'none';
      });
      if (p) p.addEventListener('click', function(e) {
        e.preventDefault();
        localStorage.removeItem(KEY);
        if (banner) banner.style.display = 'flex';
      });
    })();
  </script>

</body>
</html>
