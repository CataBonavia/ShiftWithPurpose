<svg viewBox="0 0 200 180" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Starburst lines radiating from focal point at bottom-left -->
  <!-- Short steep left stroke -->
  <line x1="48" y1="152" x2="30" y2="102" stroke="#ced78d" stroke-width="4.2" stroke-linecap="round"/>
  <!-- Medium upper-left stroke -->
  <line x1="48" y1="152" x2="16" y2="58"  stroke="#ced78d" stroke-width="5.2" stroke-linecap="round"/>
  <!-- Upper-centre stroke -->
  <line x1="48" y1="152" x2="68" y2="26"  stroke="#ced78d" stroke-width="5.6" stroke-linecap="round"/>
  <!-- Upper-right stroke -->
  <line x1="48" y1="152" x2="112" y2="42" stroke="#ced78d" stroke-width="5.2" stroke-linecap="round"/>
  <!-- Long right stroke -->
  <line x1="48" y1="152" x2="168" y2="36" stroke="#ced78d" stroke-width="5.6" stroke-linecap="round"/>
  <!-- Very long near-horizontal stroke -->
  <line x1="48" y1="152" x2="196" y2="62" stroke="#ced78d" stroke-width="4.5" stroke-linecap="round"/>
</svg>
